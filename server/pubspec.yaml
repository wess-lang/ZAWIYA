name: zawiya_server
description: ZAWIYA backend — a Dart/shelf port of the original Next.js API routes, serving the same data/db.json and the same REST contract the Flutter app (../mobile) already consumes.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  bcrypt: ^1.1.3
  crypto: ^3.0.3
  uuid: ^4.4.0
  http: ^1.2.2

dev_dependencies:
  lints: ^4.0.0
