name: zawiya_mobile
description: ZAWIYA — Design Your Space. Native mobile client for the ZAWIYA furniture marketplace, talking to the existing Next.js backend as its REST API.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.14
  image_picker: ^1.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
